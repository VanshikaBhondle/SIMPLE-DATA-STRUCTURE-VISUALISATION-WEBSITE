<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Structure Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>Data Structure Visualizer</h1>
    <p>Interactive visualizations for Array, Stack, Queue, Linked List, BST, Heap, Graph & Hash Table</p>
  </header>

  <!-- Top-level tabs -->
  <nav class="tabs">
    <button class="tab active" data-tab="array">Array</button>
    <button class="tab" data-tab="stack">Stack</button>
    <button class="tab" data-tab="queue">Queue</button>
    <button class="tab" data-tab="linkedlist">Linked List</button>
    <button class="tab" data-tab="bst">BST</button>
    <button class="tab" data-tab="heap">Heap</button>
    <button class="tab" data-tab="graph">Graph</button>
    <button class="tab" data-tab="hash">Hash Table</button>
  </nav>

  <main class="content">

    <!-- ============== ARRAY ============== -->
    <section id="array" class="panel active">
      <h2>Array</h2>
      <div class="controls">
        <input type="text" id="arrInput" placeholder="e.g. 5,3,8,1,9" />
        <button onclick="loadArray()">Load</button>
        <input type="number" id="arrIdx" placeholder="index" />
        <input type="number" id="arrVal" placeholder="value" />
        <button onclick="insertAt()">Insert@i</button>
        <button onclick="deleteAt()">Delete@i</button>
        <button onclick="updateAt()">Update@i</button>
        <button onclick="reverseArray()">Reverse</button>
        <input type="number" id="arrSearch" placeholder="search value" />
        <button onclick="linearSearch()">Linear Search</button>
        <button onclick="binarySearch()">Binary Search</button>
        <select id="sortAlgo">
          <option value="bubble">Bubble</option>
          <option value="selection">Selection</option>
          <option value="insertion">Insertion</option>
          <option value="merge">Merge</option>
          <option value="quick">Quick</option>
        </select>
        <button onclick="runSort()">Sort</button>
      </div>
      <div id="arrView" class="view row"></div>
      <p id="arrStatus" class="status"></p>
    </section>

    <!-- ============== STACK ============== -->
    <section id="stack" class="panel">
      <h2>Stack (LIFO)</h2>
      <div class="controls">
        <input type="number" id="stackVal" placeholder="value" />
        <button onclick="pushStack()">Push</button>
        <button onclick="popStack()">Pop</button>
        <button onclick="peekStack()">Peek</button>
        <button onclick="stackInfo()">isEmpty / Size</button>
        <button onclick="resetStack()">Clear</button>
      </div>
      <div id="stackView" class="view col-reverse"></div>
      <p id="stackStatus" class="status"></p>
    </section>

    <!-- ============== QUEUE ============== -->
    <section id="queue" class="panel">
      <h2>Queue</h2>
      <div class="subtabs">
        <button class="subtab active" data-qtype="linear">Linear</button>
        <button class="subtab" data-qtype="circular">Circular</button>
        <button class="subtab" data-qtype="priority">Priority</button>
        <button class="subtab" data-qtype="deque">Deque</button>
      </div>

      <!-- Linear -->
      <div class="qpanel active" data-qpanel="linear">
        <div class="controls">
          <input type="number" id="qVal" placeholder="value" />
          <button onclick="enqueue()">Enqueue</button>
          <button onclick="dequeue()">Dequeue</button>
          <button onclick="peekQueue()">Peek</button>
          <button onclick="queueInfo()">isEmpty / Size</button>
          <button onclick="resetQueue()">Clear</button>
        </div>
        <div id="qView" class="view row"></div>
      </div>

      <!-- Circular -->
      <div class="qpanel" data-qpanel="circular">
        <div class="controls">
          <input type="number" id="cqCap" placeholder="capacity (default 6)" />
          <button onclick="cqInit()">Init</button>
          <input type="number" id="cqVal" placeholder="value" />
          <button onclick="cqEnqueue()">Enqueue</button>
          <button onclick="cqDequeue()">Dequeue</button>
          <button onclick="cqClear()">Clear</button>
        </div>
        <div id="cqView" class="view row"></div>
      </div>

      <!-- Priority -->
      <div class="qpanel" data-qpanel="priority">
        <div class="controls">
          <input type="number" id="pqVal" placeholder="value" />
          <input type="number" id="pqPri" placeholder="priority (lower = higher)" />
          <button onclick="pqEnqueue()">Enqueue</button>
          <button onclick="pqDequeue()">Dequeue</button>
          <button onclick="pqClear()">Clear</button>
        </div>
        <div id="pqView" class="view row"></div>
      </div>

      <!-- Deque -->
      <div class="qpanel" data-qpanel="deque">
        <div class="controls">
          <input type="number" id="dqVal" placeholder="value" />
          <button onclick="dqPushFront()">Push Front</button>
          <button onclick="dqPushBack()">Push Back</button>
          <button onclick="dqPopFront()">Pop Front</button>
          <button onclick="dqPopBack()">Pop Back</button>
          <button onclick="dqClear()">Clear</button>
        </div>
        <div id="dqView" class="view row"></div>
      </div>

      <p id="queueStatus" class="status"></p>
    </section>

    <!-- ============== LINKED LIST ============== -->
    <section id="linkedlist" class="panel">
      <h2>Linked List</h2>
      <div class="subtabs">
        <button class="subtab active" data-lltype="singly">Singly</button>
        <button class="subtab" data-lltype="doubly">Doubly</button>
        <button class="subtab" data-lltype="circular">Circular</button>
      </div>
      <div class="controls">
        <input type="number" id="llVal" placeholder="value" />
        <input type="number" id="llPos" placeholder="position" />
        <button onclick="llInsert()">Insert@pos</button>
        <button onclick="llDelete()">Delete@pos</button>
        <button onclick="llSearch()">Search</button>
        <button onclick="llSort()">Sort</button>
        <button onclick="llReverse()">Reverse</button>
        <button onclick="llMiddle()">Find Middle</button>
        <button onclick="llInjectCycle()">Inject Cycle</button>
        <button onclick="llDetectCycle()">Detect Cycle</button>
        <button onclick="llClear()">Clear</button>
      </div>
      <div id="llView" class="view row"></div>
      <p id="llStatus" class="status"></p>
    </section>

    <!-- ============== BST ============== -->
    <section id="bst" class="panel">
      <h2>Binary Search Tree</h2>
      <div class="controls">
        <input type="number" id="bstVal" placeholder="value" />
        <button onclick="bstInsert()">Insert</button>
        <button onclick="bstDelete()">Delete</button>
        <button onclick="bstSearch()">Search</button>
        <button onclick="bstTraverse('inorder')">Inorder</button>
        <button onclick="bstTraverse('preorder')">Preorder</button>
        <button onclick="bstTraverse('postorder')">Postorder</button>
        <button onclick="bstTraverse('level')">Level-order</button>
        <button onclick="bstStats()">Height/Min/Max</button>
        <button onclick="bstClear()">Clear</button>
      </div>
      <div id="bstView" class="view"></div>
      <p id="bstStatus" class="status"></p>
    </section>

    <!-- ============== HEAP ============== -->
    <section id="heap" class="panel">
      <h2>Heap</h2>
      <div class="controls">
        <select id="heapType">
          <option value="min">Min-Heap</option>
          <option value="max">Max-Heap</option>
        </select>
        <button onclick="heapSetType()">Set Type (resets)</button>
        <input type="number" id="heapVal" placeholder="value" />
        <button onclick="heapInsert()">Insert</button>
        <button onclick="heapExtract()">Extract Root</button>
        <button onclick="heapPeek()">Peek</button>
        <input type="text" id="heapBuild" placeholder="build: 7,3,9,1,5" />
        <button onclick="heapBuildFn()">Build Heap</button>
        <button onclick="heapClear()">Clear</button>
      </div>
      <div id="heapView" class="view"></div>
      <p id="heapStatus" class="status"></p>
    </section>

    <!-- ============== GRAPH ============== -->
    <section id="graph" class="panel">
      <h2>Graph</h2>
      <div class="controls">
        <input type="text" id="gNode" placeholder="node label (A)" />
        <button onclick="gAddNode()">Add Node</button>
        <button onclick="gRemoveNode()">Remove Node</button>
        <input type="text" id="gEdgeFrom" placeholder="from" />
        <input type="text" id="gEdgeTo" placeholder="to" />
        <button onclick="gAddEdge()">Add Edge</button>
        <button onclick="gRemoveEdge()">Remove Edge</button>
        <label class="inline">
          <input type="checkbox" id="gDirected" /> directed
        </label>
        <input type="text" id="gStart" placeholder="start node" />
        <button onclick="gBFS()">BFS</button>
        <button onclick="gDFS()">DFS</button>
        <button onclick="gClear()">Clear</button>
      </div>
      <div id="gView" class="view"></div>
      <p id="gStatus" class="status"></p>
    </section>

    <!-- ============== HASH TABLE ============== -->
    <section id="hash" class="panel">
      <h2>Hash Table (Separate Chaining)</h2>
      <div class="controls">
        <input type="number" id="hBuckets" placeholder="buckets (default 7)" />
        <button onclick="hInit()">Init</button>
        <input type="text" id="hKey" placeholder="key" />
        <input type="text" id="hVal" placeholder="value" />
        <button onclick="hSet()">Set</button>
        <button onclick="hGet()">Get</button>
        <button onclick="hDel()">Delete</button>
        <button onclick="hClear()">Clear</button>
      </div>
      <div id="hView" class="view col"></div>
      <p id="hStatus" class="status"></p>
    </section>

  </main>

  <footer class="footer">
    <p>Built with vanilla HTML, CSS & JavaScript — for learning DSA visually.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
